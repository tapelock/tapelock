name: Dogfood

# Tapelock testing itself: replay the committed
# cassette in examples/chatbot and run chatbot against it exactly as it
# runs against the real API. A cassette miss here means chatbot's own
# request changed without being re-recorded. See
# examples/chatbot/replay_check.sh.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  replay:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 'stable'

      - run: ./examples/chatbot/replay_check.sh
